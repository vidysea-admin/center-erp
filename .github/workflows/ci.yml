name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # QA-1065: every machine runs IST - CI, production, dev. Umesh, 2026-08-25:
          # "system mai sabb IST mai hoga". ubuntu-latest is UTC unless told otherwise.
          TZ: Asia/Kolkata
          MONGODB_URL: mongodb://ci-placeholder:27017
          AUTH_SECRET: ci-placeholder

  # The e2e suites need a live server and a real MongoDB, which is why they used to run only by
  # hand — and why every defect in the 2026-08-12 audit survived: the assertions existed, nothing
  # ever ran them. A service container gives them both, so they run on every push and PR.
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # QA-1065 (2026-08-25) - THE ONE LINE THIS WHOLE FINDING COMES DOWN TO.
      # ubuntu-latest runs UTC; every developer machine here runs IST. IST is UTC+5:30, so the two
      # calendar dates differ between 18:30 and 24:00 UTC (00:00-05:30 IST) - and this product decides
      # on the INDIAN day (istToday(), dayKey(), Rule 26 rosters, Rule 28 frozen counts, government
      # attendance). Over 100 runs of this workflow: 0 of 18 that landed inside that window passed,
      # and 82 of 82 outside it did. CI was never green on this - it was green by the clock, and each
      # of those 18 was a release that deployed anyway, because CodePipeline does not gate on Actions.
      # Umesh's call, recorded verbatim in qa/feedback-inbox.md: "system mai sabb IST mai hoga".
      # scripts/run-e2e.mjs now REFUSES to run outside IST, so this line is what keeps CI able to run.
      TZ: Asia/Kolkata
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: center_erp_ci
      AUTH_SECRET: ci-only-not-a-real-secret
      AUTH_TRUST_HOST: "true"
      BASE_URL: http://localhost:3000/erp
      ADMIN_PASSWORD: admin123
      # -95: the bucket is named in code; the wall must never touch the real bucket (its AWS
      # identity is not one the pool trusts anyway). Off-switch for CI/test ONLY — never on prod.
      STORAGE_DISABLE: "1"
      # -97: CORS rule pins assert the production origin (the app derives it from APP_ORIGIN / AUTH_URL)
      APP_ORIGIN: https://www.vidysea.com
      # -100: the single-truth sheet policy is ON in CI (a Google URL must be refused there too);
      # this only additionally permits the suites' data:/localhost fixtures, never a public host.
      SYNC_ALLOW_TEST_SOURCES: "1"
      # -110: SMS. Suppression is structural first (MONGODB_DB=center_erp_ci), so no wall run can
      # text a real student even with credentials present; SMS_DISABLED is the MAIL_DISABLED twin
      # as belt-and-braces. SMS_DAILY_CAP=6 lets the roles suite exercise the daily-cap trip.
      SMS_DISABLED: "1"
      SMS_DAILY_CAP: "6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Seed core data
        run: npm run seed

      - name: Start the server
        run: |
          npm start &
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL/api/public/version" >/dev/null; then echo "server up"; exit 0; fi
            sleep 2
          done
          echo "server did not come up in time"; exit 1

      # seed-sample talks to the running server on purpose, so every rule and audit row applies.
      - name: Seed the sample dataset
        run: npm run seed:sample

      # scripts/run-e2e.mjs runs EVERY suite (no fail-fast) and prints a per-suite table, so one
      # broken suite no longer hides whether the rest passed. The suite list lives in that file —
      # it was previously hand-duplicated here and in package.json and the copies drifted.
      # Coverage map: qa/EVAL-MATRIX.md.
      - name: All e2e suites
        run: npm test
